<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cizgi Roman Sesi</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h2>🔊 Sahne Sesi</h2>
  
  <audio id="sesOynatici" autoplay controls>
    <source src="sayfa01.mp3" type="audio/mpeg">
    Tarayıcınız bu sesi oynatamıyor.
  </audio>

  <script>
    window.addEventListener('click', function() {
      var ses = document.getElementById('sesOynatici');
      if (ses.paused) {
        ses.play();
      }
    });
  </script>
</body>
</html>
